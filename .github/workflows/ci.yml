name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支的新推送會取消尚在跑的舊工作
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型別檢查 · 單元測試 · Web 建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript 型別檢查
        run: npm run typecheck

      - name: Jest 單元測試
        run: npm test -- --ci

      - name: Web 建置
        run: npm run build:web

      # E2E 需要這份產物，避免在下個 job 重跑一次建置
      - name: 上傳 web 產物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 取回 web 產物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install --with-deps chromium

      - name: 執行 E2E
        run: npm run e2e

      - name: 上傳失敗報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
